server {
    listen 8080;
    # localhost dentro do container resolve para ::1, entao o healthcheck
    # do Docker so funciona se o nginx tambem escutar em IPv6.
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressao dos assets de texto.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida volta para o index.html, para que o
    # React Router (Sprint 2) assuma a navegacao.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
